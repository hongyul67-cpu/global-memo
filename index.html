const { useState, useRef, useEffect } = React;

/* 호주 글로벌 현장학습 · 현장 기록장 (시제품)
   - 기록 전용. 안전·통솔은 기성 앱(구글 지도·카톡)에 맡김.
   - 핵심 장치: '본 것(사실)' = 파랑 / '내 생각·질문' = 호박색.
   - 사진 1기록당 0~5장(선택 — 사진 못 올리는 폰도 글만으로 저장·제출). PDF는 '인쇄 → PDF로 저장' 방식.
   - 시제품이라 새로고침 시 기록이 사라짐(영구 저장 미연결). */

const C = {
  bg: "#F4F6F9", ink: "#1B2733", sub: "#5C6B7A",
  blue: "#1E5FA8", blueSoft: "#E9F1F9", blueLine: "#B6CFE8",
  amber: "#C97A0A", amberSoft: "#FBF2E0", amberLine: "#EAD3A0",
  line: "#D7DEE6", card: "#FFFFFF", steel: "#7E92A4",
};

const KEYWORDS = ["안전", "기술·용접", "교육·제도", "문화", "음식", "기타"];
const VISITS = ["학교(TAFE)", "회사", "기타"];
const FORM_URL = "https://forms.gle/X42oD6U71bcfTSydA";
// 선생님 구글 계정에 배포한 Apps Script 웹앱 주소 (기록을 직접 받아 스프레드시트+드라이브에 저장)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHIJLyCSl-iV6CLac1qWO8a8fkyXbXaPC29sIKLPowGYduoG5W7fy4v57VaveZukE6Zg/exec";
const SUBMIT_TOKEN = "fieldlog-2026";

function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function koMD(s) { // "2026-10-19" → "10월 19일"
  const [, m, d] = String(s || "").split("-");
  return m && d ? `${Number(m)}월 ${Number(d)}일` : String(s || "");
}
function prettyDate(s) {
  if (!s) return "";
  const [y, m, d] = s.split("-");
  return `${y}. ${m}. ${d}.`;
}
// 사진 넣기: 먼저 그대로 읽어 보고, 못 읽으면 HEIC(갤럭시 '고효율 사진'·아이폰 원본)인지 보고 JPG 로 바꿔 다시 읽음
async function downscale(file, max = 1024, quality = 0.72, onNote) {
  let d = await decodeImage(file, max, quality);
  if (d || !(await isHeic(file))) return d;
  try {
    if (onNote) onNote("HEIC 사진을 JPG 로 바꾸는 중… (한 장에 몇 초 걸려요)");
    const lib = await loadHeic();
    let out = await lib({ blob: file, toType: "image/jpeg", quality: 0.9 });
    if (Array.isArray(out)) out = out[0];
    d = await decodeImage(out, max, quality);
  } catch (e) { d = null; }
  return d;
}
async function isHeic(file) {
  if (/hei[cf]/i.test(file.type || "") || /\.(heic|heif)$/i.test(file.name || "")) return true;
  try { // 형식 이름이 비어 오는 폰이 있어 파일 머리(ftyp…)로도 확인
    const b = new Uint8Array(await new Response(file.slice(4, 12)).arrayBuffer());
    return /^ftyp(heic|heix|hevc|hevx|heim|heis|mif1|msf1)/.test(String.fromCharCode.apply(null, b));
  } catch (e) { return false; }
}
let heicLib = null; // 변환기는 필요할 때만 내려받음(약 1.3MB)
function loadHeic() {
  if (window.heic2any) return Promise.resolve(window.heic2any);
  if (!heicLib) heicLib = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    s.onload = () => (window.heic2any ? res(window.heic2any) : rej(new Error("heic")));
    s.onerror = () => { heicLib = null; rej(new Error("heic-load")); };
    document.head.appendChild(s);
  });
  return heicLib;
}
function fileTag(f) { // 못 읽은 사진 안내용: "HEIC · 3.1MB"
  const ext = ((f.name || "").match(/\.([a-z0-9]+)$/i) || [])[1] || (f.type || "").replace("image/", "") || "?";
  return `${ext.toUpperCase()} · ${(f.size / 1048576).toFixed(1)}MB`;
}
// 사진 축소: EXIF 회전 보정(createImageBitmap) + 실패 시 null 반환(멈춤 방지)
async function decodeImage(file, max = 1024, quality = 0.72) {
  const fit = (w, h) => {
    if (w > h && w > max) return [max, Math.round((h * max) / w)];
    if (h >= w && h > max) return [Math.round((w * max) / h), max];
    return [w, h];
  };
  // <img> 로 읽기 (createImageBitmap 이 없거나 실패한 폰용 예비 길)
  const viaImg = () => new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
  try {
    let src, sw, sh, bmp;
    if (window.createImageBitmap) {
      try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
      catch (e) { try { bmp = await createImageBitmap(file); } catch (e2) { bmp = null; } }
      // 아주 큰 사진(5천만 화소 등)은 메모리가 모자라 실패할 수 있어 줄여서 읽기를 한 번 더
      if (!bmp) { try { bmp = await createImageBitmap(file, { resizeWidth: max, resizeQuality: "medium", imageOrientation: "from-image" }); } catch (e3) { bmp = null; } }
    }
    if (bmp) { src = bmp; sw = bmp.width; sh = bmp.height; }
    else { src = await viaImg(); sw = src.naturalWidth || src.width; sh = src.naturalHeight || src.height; }
    if (!sw || !sh) return null;
    const [w, h] = fit(sw, sh);
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(src, 0, 0, w, h);
    if (bmp && bmp.close) bmp.close();
    return cv.toDataURL("image/jpeg", quality);
  } catch (e) {
    return null; // 이미지가 아니거나 읽기 실패 → 이 파일은 건너뜀
  }
}

// ---- 자동 저장 (이 기기에 보관) ----
const STORE_KEY = "fieldlog_v1";
function loadStore() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 미리보기 환경 등에서는 저장소 접근이 막힐 수 있음 */ }
  return null;
}
// 사진은 IndexedDB 에 따로 보관 (localStorage 는 5MB 남짓이라 사진 20장쯤이면 가득 참 →
// 그 뒤로는 새 사진·제출됨 표시가 저장되지 않아 "사진이 안 올라가요"·중복 제출이 생겼음)
const PHOTO_DB = "fieldlog_photos";
function photoDb() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error("no-idb"));
    const q = indexedDB.open(PHOTO_DB, 1);
    q.onupgradeneeded = () => q.result.createObjectStore("photos");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error || new Error("idb"));
  });
}
async function photoLoadAll() {
  const db = await photoDb();
  return new Promise((res, rej) => {
    const map = new Map(); // 기록 id → 사진 배열
    const tx = db.transaction("photos", "readonly");
    const cur = tx.objectStore("photos").openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c) { map.set(c.key, c.value); c.continue(); } };
    tx.oncomplete = () => { db.close(); res(map); };
    tx.onerror = () => { db.close(); rej(tx.error); };
  });
}
// puts: [[기록 id, [사진…]], …] 저장, dels: [기록 id…] 지움
async function photoWrite(puts, dels) {
  const db = await photoDb();
  return new Promise((res, rej) => {
    const tx = db.transaction("photos", "readwrite");
    const st = tx.objectStore("photos");
    puts.forEach(([id, ph]) => st.put(ph, id));
    dels.forEach((id) => st.delete(id));
    tx.oncomplete = () => { db.close(); res(); };
    tx.onerror = () => { db.close(); rej(tx.error); };
    tx.onabort = () => { db.close(); rej(tx.error || new Error("abort")); };
  });
}

function Chip({ active, children, onClick }) {
  return (
    <button type="button"
      onClick={onClick}
      className="px-3 py-1.5 rounded-full text-sm font-medium transition-colors duration-150 focus:outline-none focus-visible:ring-2"
      style={{
        background: active ? C.blue : C.card,
        color: active ? "#fff" : C.ink,
        border: `1px solid ${active ? C.blue : C.line}`,
      }}
    >
      {children}
    </button>
  );
}

function Eyebrow({ children }) {
  return (
    <div className="text-xs font-semibold tracking-widest uppercase" style={{ color: C.steel }}>
      {children}
    </div>
  );
}

function App() {
  const persisted = loadStore();
  const [screen, setScreen] = useState(persisted && persisted.name ? "list" : "start"); // start | list | form | export | backup
  const [name, setName] = useState(persisted?.name || "");
  const [nameDraft, setNameDraft] = useState("");
  const [records, setRecords] = useState(persisted?.records || []);
  const [editingId, setEditingId] = useState(null);
  const [confirmId, setConfirmId] = useState(null);
  const [selected, setSelected] = useState({}); // id -> bool, for export
  const [editingName, setEditingName] = useState(false);
  const [renameDraft, setRenameDraft] = useState("");
  const [storeWarn, setStoreWarn] = useState(false);
  const [importPending, setImportPending] = useState(null); // 불러온 백업 데이터(확인 대기)
  const [backupMsg, setBackupMsg] = useState("");
  const fileRef = useRef(null);
  const backupRef = useRef(null);
  const [sending, setSending] = useState(false);     // 전송 중 여부
  const [sendResult, setSendResult] = useState(null); // {ok, msg}
  const [confirmReset, setConfirmReset] = useState(false); // 전체 초기화 확인

  // 기록·이름이 바뀔 때마다 이 기기에 자동 저장
  //  글 → localStorage, 사진 → IndexedDB (IndexedDB 를 못 쓰는 폰만 예전처럼 사진까지 localStorage)
  const [photosReady, setPhotosReady] = useState(false);
  const savedPhotos = useRef(new Map()); // IndexedDB 에 이미 들어간 사진 배열 (기록 id → 배열)
  const idbOK = useRef(true);
  const latest = useRef({ name, records });
  latest.current = { name, records };
  const chain = useRef(Promise.resolve()); // 저장을 한 줄로 세움(앞 저장이 끝난 뒤 다음 저장)

  // 처음 한 번: IndexedDB 의 사진을 기록에 다시 붙임. 예전 판에서 localStorage 에 든 사진은 그대로 두었다가 아래 저장 때 옮김
  useEffect(() => {
    photoLoadAll().then((map) => {
      savedPhotos.current = map;
      setRecords((rs) => rs.map((r) => (
        (!r.photos || !r.photos.length) && map.has(r.id) ? { ...r, photos: map.get(r.id) } : r)));
    }).catch(() => { idbOK.current = false; })
      .then(() => setPhotosReady(true));
  }, []);

  async function persist() {
    const { name, records } = latest.current;
    let inDb = false;
    if (idbOK.current) {
      const puts = [], dels = [], ids = new Set();
      records.forEach((r) => {
        ids.add(r.id);
        const ph = r.photos || [];
        if (savedPhotos.current.get(r.id) !== ph) puts.push([r.id, ph]);
      });
      savedPhotos.current.forEach((_, id) => { if (!ids.has(id)) dels.push(id); });
      try {
        if (puts.length || dels.length) await photoWrite(puts, dels);
        puts.forEach(([id, ph]) => savedPhotos.current.set(id, ph));
        dels.forEach((id) => savedPhotos.current.delete(id));
        inDb = true;
      } catch (e) {
        idbOK.current = false;
      }
    }
    try {
      const keep = inDb ? records.map((r) => (r.photos && r.photos.length ? { ...r, photos: [] } : r)) : records;
      window.localStorage.setItem(STORE_KEY, JSON.stringify({ name, records: keep }));
      setStoreWarn(false);
    } catch (e) {
      setStoreWarn(true);
    }
  }
  useEffect(() => {
    if (!photosReady) return; // 사진을 다 불러오기 전에 쓰면 사진 없는 기록으로 덮어씀
    chain.current = chain.current.then(persist, persist);
  }, [name, records, photosReady]);

  // form state
  const blankForm = {
    date: todayStr(), place: "", visit: "", keywords: [],
    facts: "", impression: "", difference: "", question: "", photos: [],
  };
  const [form, setForm] = useState(blankForm);
  const [error, setError] = useState("");
  const [photoBusy, setPhotoBusy] = useState(false); // 사진 줄이는 중
  const [photoMsg, setPhotoMsg] = useState("");      // 사진 안내(읽기 실패 등)

  const setF = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  function openNew() {
    setForm(blankForm); setEditingId(null); setError(""); setPhotoMsg(""); setScreen("form");
  }
  function openEdit(r) {
    setForm({ ...blankForm, ...r }); setEditingId(r.id); setError(""); setPhotoMsg(""); setScreen("form");
  }
  function toggleKeyword(k) {
    setF("keywords", form.keywords.includes(k)
      ? form.keywords.filter((x) => x !== k)
      : [...form.keywords, k]);
  }
  async function addPhotos(files) {
    const list = Array.from(files || []);
    const room = 5 - form.photos.length;
    if (room <= 0 || !list.length) return;
    setPhotoBusy(true); setPhotoMsg("");
    const next = []; const bad = [];
    try {
      for (const f of list.slice(0, room)) {
        let d = null;
        try { d = await downscale(f, 1024, 0.72, setPhotoMsg); } catch (e) { d = null; }
        if (d) next.push(d); else bad.push(f);
      }
    } finally { setPhotoBusy(false); }
    if (next.length) setForm((f) => ({ ...f, photos: [...f.photos, ...next].slice(0, 5) }));
    setPhotoMsg("");
    if (bad.length) {
      const heic = bad.some((f) => /\.(heic|heif)$/i.test(f.name || "") || /hei[cf]/i.test(f.type || ""));
      setPhotoMsg(`사진 ${bad.length}장은 이 폰에서 읽지 못했어요 (${fileTag(bad[0])}). `
        + (heic ? "인터넷이 될 때 다시 넣어 보거나, 카메라 설정에서 '고효율 사진'을 끄고 찍으면 잘 들어가요. " : "다른 사진을 고르거나, 화면 캡처한 사진으로 넣어 보세요. ")
        + "사진 없이 저장해도 괜찮아요.");
    }
    else if (list.length > room) setPhotoMsg(`사진은 최대 5장이라 ${room}장만 넣었어요.`);
  }
  function removePhoto(i) {
    setForm((f) => ({ ...f, photos: f.photos.filter((_, idx) => idx !== i) }));
  }
  function save() {
    if (!form.place.trim()) return setError("장소를 적어 주세요.");
    if (!form.facts.trim()) return setError("본 것을 한 줄이라도 적어 주세요.");
    // 사진은 선택 — 사진을 못 올리는 폰도 글만으로 저장·제출할 수 있게 함
    if (photoBusy) return setError("사진을 넣는 중이에요. 잠깐만 기다렸다가 다시 눌러 주세요.");
    if (editingId) {
      const old = records.find((r) => r.id === editingId) || {};
      const same = (a, b) => JSON.stringify(a ?? "") === JSON.stringify(b ?? "");
      const op = old.photos || [], fp = form.photos || [];
      const changed = ["date", "place", "visit", "keywords", "facts", "impression", "difference", "question"]
        .some((k) => !same(old[k], form[k])) || op.length !== fp.length || op.some((p, i) => p !== fp[i]);
      if (changed) {
        // 내용이 바뀌었으니 '제출됨' 표시를 지워 다시 보낼 수 있게 함. 이미 낸 기록이면 다음 제출이 '수정본'
        const sentCount = old.sentCount || (old.sentAt ? 1 : 0);
        setRecords((rs) => rs.map((r) => (r.id === editingId
          ? { ...form, id: editingId, sentAt: null, sentCount, editedAt: sentCount ? todayStr() : null } : r)));
      }
    } else {
      setRecords((rs) => [...rs, { ...form, id: Date.now() }]);
    }
    setScreen("list");
  }
  function doDelete(id) {
    setRecords((rs) => rs.filter((r) => r.id !== id));
    setConfirmId(null);
  }
  function openExport(onlyToday) {
    const today = todayStr();
    const hasToday = records.some((r) => r.date === today);
    const sel = {};
    records.forEach((r) => (sel[r.id] = onlyToday && hasToday ? r.date === today : true));
    setSelected(sel);
    setScreen("export");
  }
  function openBackup() {
    setBackupMsg(""); setImportPending(null); setScreen("backup");
  }
  // ---- 백업(전체 내보내기 / 불러오기) ----
  function exportBackup() {
    try {
      const data = { app: "fieldlog", version: 1, exportedAt: new Date().toISOString(), name, records };
      const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `기록백업-${(name || "이름").trim()}-${todayStr().replace(/-/g, "")}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      setBackupMsg(`백업 파일을 저장했어요. (기록 ${records.length}개) 다운로드 폴더나 파일 앱에서 확인하세요.`);
    } catch (e) {
      setBackupMsg("백업 파일을 저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
    }
  }
  function readBackup(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || !Array.isArray(data.records)) throw new Error("bad");
        setBackupMsg("");
        setImportPending(data);
      } catch (err) {
        setBackupMsg("백업 파일을 읽을 수 없어요. 올바른 백업 파일(.json)인지 확인해 주세요.");
      }
    };
    reader.onerror = () => setBackupMsg("파일을 여는 중 문제가 생겼어요.");
    reader.readAsText(file);
  }
  function applyImport(mode) {
    const data = importPending;
    if (!data) return;
    if (mode === "replace") {
      setRecords(data.records);
      if (data.name) setName(data.name);
      setBackupMsg(`백업으로 전부 바꿨어요. (기록 ${data.records.length}개)`);
    } else {
      const existing = new Set(records.map((r) => r.id));
      const added = data.records.filter((r) => !existing.has(r.id));
      setRecords((rs) => [...rs, ...added]);
      if (!name && data.name) setName(data.name);
      setBackupMsg(`백업을 합쳤어요. 새로 추가된 기록 ${added.length}개 (중복 ${data.records.length - added.length}개는 건너뜀).`);
    }
    setImportPending(null);
  }

  // ---- 선생님께 전송 (Google Apps Script) ----
  async function postRecord(r) {
    // 이미 낸 기록을 고쳐 다시 내면 날짜 칸에 '수정본'과 고친 날짜를 붙임
    // → 선생님 쪽 PDF 일시 칸·파일 이름·제출목록에 그대로 보임 (구글 코드 재배포 필요 없음)
    const rev = r.sentCount || 0;
    const date = rev ? `${r.date} (수정본${rev > 1 ? " " + rev : ""} · ${koMD(r.editedAt || todayStr())} 수정)` : r.date;
    const payload = {
      token: SUBMIT_TOKEN, name,
      date, place: r.place, visit: r.visit, revision: rev, editedAt: r.editedAt || null,
      keywords: r.keywords || [], facts: r.facts,
      impression: r.impression, difference: r.difference,
      question: r.question, photos: r.photos || [],
    };
    // text/plain 으로 보내야 사전요청(preflight) 없이 Apps Script에 도달함
    let res;
    try {
      res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      throw new Error("인터넷 연결이 끊겼거나 약해요");
    }
    let json = null;
    try { json = await res.json(); } catch (e) { json = null; }
    if (!json) throw new Error(`서버 응답을 읽지 못했어요(${res.status})`);
    if (!json.ok) throw new Error(json.error || "서버 오류");
  }
  async function submitUnsent() {
    const targets = records.filter((r) => !r.sentAt);
    if (!targets.length) { setSendResult({ ok: true, msg: "보낼 새 기록이 없어요. 모두 제출되었습니다." }); return; }
    setSending(true); setSendResult(null);
    const sentIds = []; let fail = 0; let lastErr = "";
    for (const r of targets) {
      try { await postRecord(r); sentIds.push(r.id); }
      catch (e) { fail++; lastErr = (e && e.message) ? e.message : String(e); }
    }
    if (sentIds.length) {
      const now = new Date().toISOString();
      setRecords((rs) => rs.map((r) => (sentIds.includes(r.id) ? { ...r, sentAt: now, sentCount: (r.sentCount || 0) + 1 } : r)));
    }
    setSending(false);
    setSendResult(
      fail === 0
        ? { ok: true, msg: `제출 완료! 기록 ${sentIds.length}건을 PDF로 만들어 선생님께 보냈어요.` }
        : { ok: false, msg: `${sentIds.length}건 성공 · ${fail}건 실패.${lastErr ? ` (${lastErr})` : ""} 와이파이/스크립트 설정을 확인한 뒤 다시 눌러 주세요.` }
    );
  }

  const unsentCount = records.filter((r) => !r.sentAt).length;

        @media print {
          .no-print { display:none !important; }
          .print-area { box-shadow:none !important; }
          .rec-block { break-inside: avoid; }
          * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          body, html { background:#fff !important; }
        }
      `}</style>

                  </label>
                ))}
              </div>
              <button type="button" onClick={() => window.print()} disabled={chosen.length === 0}
                className="mt-4 w-full rounded-xl py-3 text-base font-semibold"
                style={{ background: C.blue, color: "#fff", opacity: chosen.length ? 1 : 0.4 }}>
                PDF로 저장 ({chosen.length}개)
              </button>
              <div className="mt-6 text-xs font-semibold tracking-widest uppercase" style={{ color: C.steel }}>미리보기</div>
            </div>

            {/* print area */}
            <div className="print-area mt-3 rounded-2xl p-5" style={{ background: "#fff", border: `1px solid ${C.line}` }}>
              <div className="pb-3 mb-4" style={{ borderBottom: `2px solid ${C.blue}` }}>
                <div className="text-xs font-semibold tracking-widest uppercase" style={{ color: C.steel }}>호주 글로벌 현장학습 · 현장 기록</div>
                <div className="mt-1 text-xl font-bold">{name}</div>
              </div>
              {chosen.length === 0 && <div className="text-sm" style={{ color: C.steel }}>선택된 기록이 없어요.</div>}
              {chosen.map((r) => (
                <div key={r.id} className="rec-block mb-7">
                  <div className="flex items-baseline justify-between">
                    <div className="text-lg font-bold">{prettyDate(r.date)}</div>
                    <div className="text-sm" style={{ color: C.sub }}>{r.place}{r.visit ? ` · ${r.visit}` : ""}</div>
                  </div>
                  {r.keywords.length > 0 && (
                    <div className="mt-1.5 flex flex-wrap gap-1.5">
                      {r.keywords.map((k) => <span key={k} className="px-2 py-0.5 rounded-full text-xs" style={{ background: C.blueSoft, color: C.blue }}>{k}</span>)}
                    </div>
                  )}
                  <div className="mt-3 flex gap-0">
                    <div className="flex-1 pr-3">
                      <div className="text-xs font-bold mb-1" style={{ color: C.blue }}>본 것 · 사실</div>
                      <p className="text-sm leading-relaxed whitespace-pre-wrap">{r.facts || "—"}</p>
                    </div>
                    <div style={{ width: 0, borderLeft: `2px dashed ${C.blueLine}` }} />
                    <div className="flex-1 pl-3">
                      <div className="text-xs font-bold mb-1" style={{ color: C.amber }}>내 생각 · 질문</div>
                      {r.impression && <p className="text-sm leading-relaxed whitespace-pre-wrap">{r.impression}</p>}
                      {r.difference && <p className="text-sm leading-relaxed whitespace-pre-wrap mt-1.5"><b style={{color:C.sub}}>다른 점 </b>{r.difference}</p>}
                      {r.question && <p className="text-sm leading-relaxed whitespace-pre-wrap mt-1.5"><b style={{color:C.sub}}>질문 </b>{r.question}</p>}
                      {!r.impression && !r.difference && !r.question && <p className="text-sm" style={{ color: C.steel }}>—</p>}
                    </div>
                  </div>
                  {r.photos.length > 0 && (
                    <div className="mt-3 grid grid-cols-3 gap-2">
                      {r.photos.map((p, i) => <img key={i} src={p} alt="" className="w-full rounded-lg object-cover" style={{ height: 110, border: `1px solid ${C.line}` }} />)}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ---------------- BACKUP (export / import) ---------------- */}
        {screen === "backup" && (
          <div className="pt-6">
            <div className="flex items-center justify-between">
              <button type="button" onClick={() => setScreen("list")} className="text-sm font-medium" style={{ color: C.steel }}>‹ 목록</button>
              <div className="text-sm font-semibold">백업 · 복원</div>
              <div className="w-10" />
            </div>

            <div className="mt-4 rounded-2xl p-4" style={{ background: C.blueSoft, border: `1px solid ${C.blueLine}` }}>
              <p className="text-sm leading-relaxed" style={{ color: C.blue }}>
                기록은 이 폰에만 저장돼요. <b>폰을 잃어버리거나 앱(브라우저 기록)을 지우면 사라집니다.</b> 가끔 <b>백업 파일</b>을 저장해 두면, 새 폰에서 <b>불러오기</b>로 되살릴 수 있어요.
              </p>
            </div>

            {/* 내보내기 */}
            <div className="mt-4 rounded-2xl p-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
              <div className="text-sm font-bold">1. 백업 파일 저장 (내보내기)</div>
              <p className="mt-1 text-sm" style={{ color: C.sub }}>지금까지의 기록 {records.length}개와 사진을 파일 하나로 저장해요.</p>
              <button type="button" onClick={exportBackup} disabled={records.length === 0}
                className="mt-3 w-full rounded-xl py-3 text-base font-semibold"
                style={{ background: C.blue, color: "#fff", opacity: records.length ? 1 : 0.4 }}>
                백업 파일 저장하기
              </button>
            </div>

            {/* 불러오기 */}
            <div className="mt-4 rounded-2xl p-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
              <div className="text-sm font-bold">2. 백업 파일 불러오기 (복원)</div>
              <p className="mt-1 text-sm" style={{ color: C.sub }}>전에 저장한 백업 파일(.json)을 골라 기록을 되살려요.</p>
              <button type="button" onClick={() => backupRef.current && backupRef.current.click()}
                className="mt-3 w-full rounded-xl py-3 text-base font-semibold"
                style={{ border: `1px solid ${C.blueLine}`, color: C.blue, background: C.blueSoft }}>
                백업 파일 고르기
              </button>
              <input ref={backupRef} type="file" accept="application/json,.json"
                style={{ position: "absolute", width: 1, height: 1, padding: 0, margin: -1, overflow: "hidden", clip: "rect(0,0,0,0)", border: 0 }}
                onChange={(e) => { if (e.target.files[0]) readBackup(e.target.files[0]); e.target.value = ""; }} />
            </div>

            {/* 전체 초기화 */}
            <div className="mt-4 rounded-2xl p-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
              <div className="text-sm font-bold" style={{ color: "#B23B3B" }}>3. 전체 초기화</div>
              <p className="mt-1 text-sm" style={{ color: C.sub }}>이 기기의 <b>모든 기록을 삭제</b>해요(연습·테스트 기록 정리용). 되돌릴 수 없으니 필요하면 먼저 위에서 <b>백업</b>을 저장하세요.</p>
              <button type="button" onClick={() => setConfirmReset(true)} disabled={records.length === 0}
                className="mt-3 w-full rounded-xl py-3 text-base font-semibold"
                style={{ border: "1px solid #E3B4B4", color: "#B23B3B", background: "#FBEDED", opacity: records.length ? 1 : 0.5 }}>
                모든 기록 지우기 ({records.length})
              </button>
            </div>

            {backupMsg && (
              <div className="mt-4 rounded-xl px-3 py-2.5 text-sm font-medium" style={{ background: C.blueSoft, color: C.blue, border: `1px solid ${C.blueLine}` }}>
                {backupMsg}
              </div>
            )}
          </div>
        )}
      </div>

      {/* bottom bar */}
      {(screen === "list") && (
        <div className="fixed bottom-0 left-0 right-0 no-print" style={{ background: "linear-gradient(to top, rgba(244,246,249,1) 60%, rgba(244,246,249,0))" }}>
          <div className="mx-auto w-full max-w-md px-4 pb-5 pt-3 flex gap-3">
            <button type="button" onClick={() => openExport(false)} disabled={records.length === 0}
              className="rounded-xl px-4 py-3.5 text-sm font-semibold"
              style={{ background: C.card, color: C.blue, border: `1px solid ${C.blueLine}`, opacity: records.length ? 1 : 0.4 }}>
              PDF
            </button>
            <button type="button" onClick={openNew} className="flex-1 rounded-xl py-3.5 text-base font-semibold" style={{ background: C.blue, color: "#fff" }}>
              + 오늘 기록 쓰기
            </button>
          </div>
        </div>
      )}

      {/* rename */}
      {editingName && (
        <div className="fixed inset-0 flex items-end justify-center no-print" style={{ background: "rgba(27,39,51,0.4)" }} onClick={() => setEditingName(false)}>
          <div className="w-full max-w-md m-4 rounded-2xl p-5" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
            <div className="text-base font-bold">이름 바꾸기</div>
            <input
              value={renameDraft}
              onChange={(e) => setRenameDraft(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && renameDraft.trim()) { setName(renameDraft.trim()); setEditingName(false); } }}
              className="mt-3 w-full rounded-xl px-3 py-3 text-base focus:outline-none focus-visible:ring-2"
              style={{ border: `1px solid ${C.line}`, background: C.bg }}
            />
            <div className="mt-4 flex gap-3">
              <button type="button" onClick={() => setEditingName(false)} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ border: `1px solid ${C.line}`, color: C.sub }}>취소</button>
              <button type="button" disabled={!renameDraft.trim()} onClick={() => { setName(renameDraft.trim()); setEditingName(false); }}
                className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue, color: "#fff", opacity: renameDraft.trim() ? 1 : 0.4 }}>저장</button>
            </div>
          </div>
        </div>
      )}

      {/* delete confirm */}
      {confirmId !== null && (
        <div className="fixed inset-0 flex items-end justify-center no-print" style={{ background: "rgba(27,39,51,0.4)" }} onClick={() => setConfirmId(null)}>
          <div className="w-full max-w-md m-4 rounded-2xl p-5" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
            <div className="text-base font-bold">이 기록을 지울까요?</div>
            <p className="mt-1 text-sm" style={{ color: C.sub }}>지운 기록은 되돌릴 수 없어요.</p>
            <div className="mt-4 flex gap-3">
              <button type="button" onClick={() => setConfirmId(null)} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ border: `1px solid ${C.line}`, color: C.sub }}>그대로 두기</button>
              <button type="button" onClick={() => { doDelete(confirmId); setScreen("list"); }} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: "#B23B3B", color: "#fff" }}>지우기</button>
            </div>
          </div>
        </div>
      )}

      {/* import confirm */}
      {importPending && (
        <div className="fixed inset-0 flex items-end justify-center no-print" style={{ background: "rgba(27,39,51,0.4)" }} onClick={() => setImportPending(null)}>
          <div className="w-full max-w-md m-4 rounded-2xl p-5" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
            <div className="text-base font-bold">백업을 불러올까요?</div>
            <p className="mt-1 text-sm" style={{ color: C.sub }}>
              파일에 기록 {importPending.records.length}개가 들어 있어요{importPending.name ? ` (이름: ${importPending.name})` : ""}. 지금 이 폰에는 {records.length}개가 있어요.
            </p>
            <button type="button" onClick={() => applyImport("merge")}
              className="mt-4 w-full rounded-xl py-3 text-sm font-semibold" style={{ background: C.blue, color: "#fff" }}>
              지금 기록에 합치기 (추천)
            </button>
            <button type="button" onClick={() => applyImport("replace")}
              className="mt-2 w-full rounded-xl py-3 text-sm font-semibold" style={{ border: `1px solid ${C.line}`, color: C.sub }}>
              이 파일로 전부 바꾸기
            </button>
            <button type="button" onClick={() => setImportPending(null)}
              className="mt-2 w-full rounded-xl py-2.5 text-sm font-medium" style={{ color: C.steel }}>
              취소
            </button>
          </div>
        </div>
      )}

      {/* reset confirm */}
      {confirmReset && (
        <div className="fixed inset-0 flex items-end justify-center no-print" style={{ background: "rgba(27,39,51,0.4)" }} onClick={() => setConfirmReset(false)}>
          <div className="w-full max-w-md m-4 rounded-2xl p-5" style={{ background: C.card }} onClick={(e) => e.stopPropagation()}>
            <div className="text-base font-bold">모든 기록을 지울까요?</div>
            <p className="mt-1 text-sm" style={{ color: C.sub }}>기록 {records.length}개가 모두 삭제되고 되돌릴 수 없어요. 필요하면 먼저 백업을 저장하세요.</p>
            <div className="mt-4 flex gap-3">
              <button type="button" onClick={() => setConfirmReset(false)} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ border: `1px solid ${C.line}`, color: C.sub }}>그대로 두기</button>
              <button type="button" onClick={() => { setRecords([]); setConfirmReset(false); setSendResult(null); setBackupMsg("모든 기록을 지웠어요."); }} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: "#B23B3B", color: "#fff" }}>모두 지우기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
